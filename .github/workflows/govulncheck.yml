name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # New vulnerabilities are published without any change here, so the code is
  # checked again every week.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # The same Go the release builds with, so a standard-library finding is
      # one the shipped binaries have.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          check-latest: true
          go-package: ./...
